name: Auto-bump ReSukiSU submodule

# Keeps the 4 resukisu branches on the latest ReSukiSU main tip.
# Safe by design: only fast-forward gitlink bumps, and only when the
# KSU Kconfig symbol set is unchanged (defconfigs stay valid).
# Anything else (Kconfig drift, fetch failures) becomes a warning or
# an issue instead of a push.

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bump ReSukiSU pins where safe
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RSU_URL="https://github.com/ReSukiSU/ReSukiSU.git"
          LATEST="$(git ls-remote "$RSU_URL" refs/heads/main | awk '{print $1}')"
          if ! [[ "$LATEST" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve ReSukiSU main tip"
            exit 1
          fi
          echo "ReSukiSU latest: ${LATEST:0:8}"
          git fetch --depth 1 "$RSU_URL" "$LATEST"

          : > /tmp/bumped.txt
          : > /tmp/review.txt

          for BR in resukisu-aosp resukisu-oneui resukisu-susfs-aosp resukisu-susfs-oneui; do
            echo "=== $BR ==="
            TIP="$(git ls-remote origin "refs/heads/$BR" | awk '{print $1}')"
            if [ -z "$TIP" ]; then
              echo "::warning::branch $BR missing on origin, skipping"
              continue
            fi
            git fetch --depth 1 origin "$BR"
            CUR="$(git ls-tree FETCH_HEAD KernelSU | awk '{print $3}')"
            echo "current=$CUR latest=$LATEST"
            if [ "$CUR" = "$LATEST" ]; then
              echo "$BR already current"
              continue
            fi
            # Kconfig compat gate: bump only if the KSU Kconfig symbol set
            # is unchanged, so branch defconfigs stay valid.
            if ! git fetch --depth 1 "$RSU_URL" "$CUR" 2>/dev/null; then
              echo "::warning::$BR cannot fetch current pin $CUR, skipping"
              continue
            fi
            for f in kernel/Kconfig kernel/Makefile; do
              if ! git cat-file -e "$LATEST:$f" 2>/dev/null; then
                echo "::warning::$BR missing $f at tip, skipping"
                continue 2
              fi
            done
            if ! git diff --quiet "$CUR" "$LATEST" -- kernel/Kconfig; then
              echo "::warning::$BR Kconfig changed upstream, needs human review"
              echo "$BR ($CUR -> $LATEST)" >> /tmp/review.txt
              continue
            fi
            git checkout -B "auto-bump/$BR" "$TIP"
            git update-index --cacheinfo "160000,$LATEST,KernelSU"
            SHORT="$(echo "$LATEST" | cut -c1-8)"
            git commit -m "resukisu: bump ReSukiSU submodule to $SHORT (auto)" -m "$CUR -> $LATEST"
            git push origin "HEAD:$BR"
            echo "$BR" >> /tmp/bumped.txt
            echo "$BR bumped to $SHORT"
          done

          echo "$LATEST" > /tmp/tip.txt
          echo "bumped<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/bumped.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "review<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/review.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Open issue for branches needing review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/review.txt ]; then
            echo "nothing needs review"
            exit 0
          fi
          BODY="$(sed 's/^/- /' /tmp/review.txt)"
          gh issue create --title "ReSukiSU bump needs human review (Kconfig drift)" --body "The auto-bump workflow held back these branches because upstream kernel/Kconfig changed:
          $BODY
          Review the symbol diff, adjust defconfigs if needed, and bump manually." || echo "issue creation failed (non-fatal)"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Auto-bump ReSukiSU"
            echo ""
            echo "Upstream tip checked: $(cat /tmp/tip.txt)"
            echo ""
            echo "Bumped branches:"
            sed 's/^/- /' /tmp/bumped.txt
            echo ""
            echo "Held for review:"
            sed 's/^/- /' /tmp/review.txt
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bumped.txt /tmp/review.txt
