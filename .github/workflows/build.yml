name: Build A52s 5G Kernel

on:
  workflow_dispatch:
    inputs:
      build_ksu_next_aosp:
        description: "Build ksu-next-aosp"
        required: false
        type: boolean
        default: false

      build_ksu_next_oneui:
        description: "Build ksu-next-oneui"
        required: false
        type: boolean
        default: false

      build_ksu_next_susfs_aosp:
        description: "Build ksu-next-susfs-aosp"
        required: false
        type: boolean
        default: true

      build_ksu_next_susfs_oneui:
        description: "Build ksu-next-susfs-oneui"
        required: false
        type: boolean
        default: false

      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.matrix.outputs.branches }}
      selected: ${{ steps.matrix.outputs.selected }}
    steps:
      - id: matrix
        shell: bash
        run: |
          branches=()

          [ "${{ inputs.build_ksu_next_aosp }}" = "true" ] && branches+=("ksu-next-aosp")
          [ "${{ inputs.build_ksu_next_oneui }}" = "true" ] && branches+=("ksu-next-oneui")
          [ "${{ inputs.build_ksu_next_susfs_aosp }}" = "true" ] && branches+=("ksu-next-susfs-aosp")
          [ "${{ inputs.build_ksu_next_susfs_oneui }}" = "true" ] && branches+=("ksu-next-susfs-oneui")

          if [ ${#branches[@]} -eq 0 ]; then
            echo "No branch selected"
            exit 1
          fi

          MATRIX=$(printf '%s\n' "${branches[@]}" | jq -R -s -c 'split("\n")[:-1]')
          echo "branches=${MATRIX}" >> $GITHUB_OUTPUT
          echo "selected=${MATRIX}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libc6-dev bc bison flex libssl-dev \
            libelf-dev cpio kmod rsync python3 curl unzip zip \
            device-tree-compiler llvm lld clang

      - name: Make build script executable
        run: chmod +x build_kernel_zip.sh

      - name: Download clang toolchain release
        run: |
          set -e

          mkdir -p toolchain

          curl -L \
            https://github.com/${{ github.repository }}/releases/download/toolchain-r530567/clang-r530567-linux-x86.tar.gz \
            -o clang.tar.gz

          tar -xzf clang.tar.gz -C toolchain

          mv toolchain/toolchain toolchain/clang

          chmod -R +x toolchain/clang/bin

          echo "${GITHUB_WORKSPACE}/toolchain/clang/bin" >> $GITHUB_PATH

          clang --version

      - name: Enable colored build output
        run: |
          echo "TERM=xterm-256color" >> $GITHUB_ENV
          echo "CLICOLOR_FORCE=1" >> $GITHUB_ENV


      - name: Fetch full submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git -C KernelSU-Next fetch --tags --force

      - name: Detect Kernel Versions
        run: |
          set -e

          KSU_VER=$(git -C KernelSU-Next describe --tags --always --long 2>/dev/null || true)

          if [ -z "$KSU_VER" ]; then
            KSU_VER=$(git -C drivers/kernelsu describe --tags --always 2>/dev/null || true)
          fi

          SUSFS_VER=$(grep '#define SUSFS_VERSION' include/linux/susfs.h | awk '{print $3}' | tr -d '"')

          COMMIT=$(git rev-parse --short HEAD)

          echo "KSU_VER=${KSU_VER:-unknown}" >> $GITHUB_ENV
          echo "SUSFS_VER=${SUSFS_VER:-unknown}" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=${COMMIT}" >> $GITHUB_ENV

          echo "========== VERSION INFO =========="
          echo "KSUN: ${KSU_VER}"
          echo "SUSFS: ${SUSFS_VER}"
          echo "Commit: ${COMMIT}"
          echo "=================================="

      - name: Build kernel
        run: yes "" | ./build_kernel_zip.sh

      - name: Find output zip
        id: find_zip
        run: |
          ZIP_PATH=$(find . -maxdepth 2 -iname "*.zip" -newer build_kernel_zip.sh | head -1)
          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          echo "Found: ${ZIP_PATH}"

      - name: Save version info
        run: |
          mkdir -p version-info
          {
            echo "KSU_VER=${{ env.KSU_VER }}"
            echo "SUSFS_VER=${{ env.SUSFS_VER }}"
            echo "COMMIT=${{ env.KERNEL_COMMIT }}"
          } > version-info/version.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: A52s5G-${{ matrix.branch }}-KSUN-${{ env.KSU_VER }}-SUSFS-${{ env.SUSFS_VER }}
          path: |
            ${{ steps.find_zip.outputs.zip_path }}
            version-info/version.txt
          if-no-files-found: error


      - name: Build Summary
        run: |
          {
            echo "## A52s 5G Kernel Build"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Branch | ${{ matrix.branch }} |"
            echo "| Commit | ${{ env.KERNEL_COMMIT }} |"
            echo "| KernelSU-Next | ${{ env.KSU_VER }} |"
            echo "| SUSFS | ${{ env.SUSFS_VER }} |"
            echo "| Status | Success |"
          } >> $GITHUB_STEP_SUMMARY


  release:
    if: ${{ inputs.create_release == true }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Detect release versions
        run: |
          set -e

          VERSION_FILE=$(find release-files -name version.txt | head -1 || true)

          if [ -f "$VERSION_FILE" ]; then
            . "$VERSION_FILE"
          fi

          echo "KSU_VER=${KSU_VER:-unknown}" >> $GITHUB_ENV
          echo "SUSFS_VER=${SUSFS_VER:-unknown}" >> $GITHUB_ENV

      - name: Prepare release info
        id: info
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          {
            echo "## A52s 5G Kernel Release"
            echo ""
            echo "Automated multi-branch kernel build"
            echo ""
            echo "Branches selected:"
            echo '${{ needs.prepare.outputs.branches }}' | jq -r '.[] | "- " + .'
            echo ""
            echo "Build workflow:"
            echo "${{ github.run_id }}"
            echo ""
            echo "Commit:"
            echo "${{ github.sha }}"
            echo ""
            echo "KSUN:"
            echo "${{ env.KSU_VER }}"
            echo ""
            echo "SUSFS:"
            echo "${{ env.SUSFS_VER }}"
          } > release_notes.md

      - name: Prepare release files
        run: |
          mkdir -p release-upload

          find release-files -type f -name "*.zip" | while read f
          do
            cp "$f" release-upload/
          done

          ls -lh release-upload


      - name: Release Summary
        run: |
          {
            echo "# 🚀 A52s 5G Kernel Release"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Workflow | ${{ github.run_id }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Branches |"
            echo '${{ needs.prepare.outputs.branches }}' | jq -r '.[] | "  - " + .'
            echo "| Status | Success |"
          } >> $GITHUB_STEP_SUMMARY


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "A52s 5G Kernel - ${{ steps.info.outputs.tag }} - KSUN-${{ env.KSU_VER }}-SUSFS-${{ env.SUSFS_VER }}"
          body_path: release_notes.md
          files: |
            release-upload/*.zip
