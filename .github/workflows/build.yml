name: Build A52s 5G Kernel

on:
  workflow_dispatch:
    inputs:
      build_ksu_next_aosp:
        description: "Build ksu-next-aosp"
        required: false
        type: boolean
        default: false

      build_ksu_next_oneui:
        description: "Build ksu-next-oneui"
        required: false
        type: boolean
        default: false

      build_ksu_next_susfs_aosp:
        description: "Build ksu-next-susfs-aosp"
        required: false
        type: boolean
        default: true

      build_ksu_next_susfs_oneui:
        description: "Build ksu-next-susfs-oneui"
        required: false
        type: boolean
        default: false

      build_resukisu_aosp:
        description: "Build resukisu-aosp"
        required: false
        type: boolean
        default: false

      build_resukisu_oneui:
        description: "Build resukisu-oneui"
        required: false
        type: boolean
        default: false

      build_resukisu_susfs_aosp:
        description: "Build resukisu-susfs-aosp"
        required: false
        type: boolean
        default: true

      build_resukisu_susfs_oneui:
        description: "Build resukisu-susfs-oneui"
        required: false
        type: boolean
        default: false

      build_kernelsu_susfs_aosp:
        description: "Build kernelsu-susfs-aosp"
        required: false
        type: boolean
        default: false

      build_kernelsu_susfs_oneui:
        description: "Build kernelsu-susfs-oneui"
        required: false
        type: boolean
        default: false

      build_kernelsu_susfs_duckfilter:
        description: "Build kernelsu-susfs-duckfilter (Duck dirty-policy experiment)"
        required: false
        type: boolean
        default: false

      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.matrix.outputs.branches }}
      selected: ${{ steps.matrix.outputs.selected }}
    steps:
      - id: matrix
        shell: bash
        run: |
          branches=()

          [ "${{ inputs.build_ksu_next_aosp }}" = "true" ] && branches+=("ksu-next-aosp")
          [ "${{ inputs.build_ksu_next_oneui }}" = "true" ] && branches+=("ksu-next-oneui")
          [ "${{ inputs.build_ksu_next_susfs_aosp }}" = "true" ] && branches+=("ksu-next-susfs-aosp")
          [ "${{ inputs.build_ksu_next_susfs_oneui }}" = "true" ] && branches+=("ksu-next-susfs-oneui")
          [ "${{ inputs.build_resukisu_aosp }}" = "true" ] && branches+=("resukisu-aosp")
          [ "${{ inputs.build_resukisu_oneui }}" = "true" ] && branches+=("resukisu-oneui")
          [ "${{ inputs.build_resukisu_susfs_aosp }}" = "true" ] && branches+=("resukisu-susfs-aosp")
          [ "${{ inputs.build_resukisu_susfs_oneui }}" = "true" ] && branches+=("resukisu-susfs-oneui")
          [ "${{ inputs.build_kernelsu_susfs_aosp }}" = "true" ] && branches+=("kernelsu-susfs-aosp")
          [ "${{ inputs.build_kernelsu_susfs_oneui }}" = "true" ] && branches+=("kernelsu-susfs-oneui")
          [ "${{ inputs.build_kernelsu_susfs_duckfilter }}" = "true" ] && branches+=("kernelsu-susfs-duckfilter")

          if [ ${#branches[@]} -eq 0 ]; then
            echo "No branch selected"
            exit 1
          fi

          MATRIX=$(printf '%s\n' "${branches[@]}" | jq -R -s -c 'split("\n")[:-1]')
          echo "branches=${MATRIX}" >> $GITHUB_OUTPUT
          echo "selected=${MATRIX}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libc6-dev bc bison flex libssl-dev \
            libelf-dev cpio kmod rsync python3 curl unzip zip \
            device-tree-compiler llvm lld clang

      - name: Make build script executable
        run: chmod +x build_kernel_zip.sh

      - name: Download clang toolchain release
        run: |
          set -e

          mkdir -p toolchain

          curl -L \
            https://github.com/${{ github.repository }}/releases/download/toolchain-r530567/clang-r530567-linux-x86.tar.gz \
            -o clang.tar.gz

          tar -xzf clang.tar.gz -C toolchain

          mv toolchain/toolchain toolchain/clang

          chmod -R +x toolchain/clang/bin

          echo "${GITHUB_WORKSPACE}/toolchain/clang/bin" >> $GITHUB_PATH

          clang --version

      - name: Enable colored build output
        run: |
          echo "TERM=xterm-256color" >> $GITHUB_ENV
          echo "CLICOLOR_FORCE=1" >> $GITHUB_ENV


      - name: Detect Kernel Versions
        run: |
          set -e

          # Select the root-solution submodule dir from the matrix branch:
          # resukisu* branches ship ReSukiSU in KernelSU/,
          # kernelsu* branches ship tiann KernelSU in KernelSU/,
          # everything else ships KernelSU-Next in KernelSU-Next/.
          # NOTE: 'kernelsu-susfs-aosp' does NOT match 'resukisu*'
          # (prefix 'k' vs 'r'), so resukisu-first ordering is safe.
          if [[ "${{ matrix.branch }}" == resukisu* ]]; then
            KSU_DIR="KernelSU"
            ROOT_NAME="ReSukiSU"
          elif [[ "${{ matrix.branch }}" == kernelsu* ]]; then
            KSU_DIR="KernelSU"
            ROOT_NAME="KernelSU"
          else
            KSU_DIR="KernelSU-Next"
            ROOT_NAME="KSUN"
          fi

          KSU_VER=$(git -C "$KSU_DIR" describe --tags --always 2>/dev/null || echo unknown)

          if [ -z "$KSU_VER" ] || [ "$KSU_VER" = "unknown" ]; then
            KSU_VER=$(git -C drivers/kernelsu describe --tags --always 2>/dev/null || echo unknown)
          fi

          # susfs.h is absent on non-SUSFS branches (e.g. resukisu-aosp):
          # silence the grep and tolerate no match so this step never
          # fails here; missing version maps to unknown below.
          SUSFS_VER=$(grep '#define SUSFS_VERSION' include/linux/susfs.h 2>/dev/null | awk '{print $3}' | tr -d '"' || true)

          COMMIT=$(git rev-parse --short HEAD)

          echo "KSU_VER=${KSU_VER:-unknown}" >> $GITHUB_ENV
          echo "SUSFS_VER=${SUSFS_VER:-unknown}" >> $GITHUB_ENV
          echo "ROOT_NAME=${ROOT_NAME}" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=${COMMIT}" >> $GITHUB_ENV

          echo "========== VERSION INFO =========="
          echo "${ROOT_NAME}: ${KSU_VER:-unknown}"
          echo "SUSFS: ${SUSFS_VER:-unknown}"
          echo "Commit: ${COMMIT}"
          echo "=================================="

      - name: Build kernel
        run: |
          set -e
          # Fully non-interactive build (replaces the legacy `yes "" |` pipe):
          # stdin is closed so an unexpected prompt fails fast instead of
          # hanging; new Kconfig symbols resolve to their defaults via
          # olddefconfig semantics.
          ./build_kernel_zip.sh < /dev/null

          # Lock in Kconfig defaults non-interactively (no-op when complete).
          make -C . O=out ARCH=arm64 olddefconfig

          # Fail-fast: CONFIG_KSU_SUSFS in the generated .config must match
          # the branch expectation (*susfs* branches require =y, all other
          # branches require unset/not-y).
          if [[ "${{ matrix.branch }}" == *susfs* ]]; then
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config \
              || { echo "::error::${{ matrix.branch }} requires CONFIG_KSU_SUSFS=y but it is not set"; grep -n 'KSU_SUSFS' out/.config || true; exit 1; }
          else
            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "::error::${{ matrix.branch }} must not enable CONFIG_KSU_SUSFS"
              grep -n 'KSU_SUSFS' out/.config || true
              exit 1
            fi
          fi
          echo "SUSFS config check passed for branch ${{ matrix.branch }}"

      - name: Find output zip
        id: find_zip
        run: |
          ZIP_PATH=$(find . -maxdepth 2 -iname "*.zip" -newer build_kernel_zip.sh | head -1)
          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          echo "Found: ${ZIP_PATH}"

      - name: Save version info
        run: |
          mkdir -p version-info
          {
            echo "KSU_VER=${{ env.KSU_VER }}"
            echo "SUSFS_VER=${{ env.SUSFS_VER }}"
            echo "ROOT_NAME=${{ env.ROOT_NAME }}"
            echo "COMMIT=${{ env.KERNEL_COMMIT }}"
          } > version-info/version.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: A52s5G-${{ matrix.branch }}-${{ env.ROOT_NAME }}-${{ env.KSU_VER }}-SUSFS-${{ env.SUSFS_VER }}
          path: |
            ${{ steps.find_zip.outputs.zip_path }}
            version-info/version.txt
          if-no-files-found: error


      - name: Build Summary
        run: |
          {
            echo "## A52s 5G Kernel Build"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Branch | ${{ matrix.branch }} |"
            echo "| Commit | ${{ env.KERNEL_COMMIT }} |"
            echo "| ${{ env.ROOT_NAME }} | ${{ env.KSU_VER }} |"
            echo "| SUSFS | ${{ env.SUSFS_VER }} |"
            echo "| Status | Success |"
          } >> $GITHUB_STEP_SUMMARY


  release:
    if: ${{ inputs.create_release == true }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Detect release versions
        run: |
          set -e

          VERSION_FILE=$(find release-files -name version.txt | head -1 || true)

          if [ -f "$VERSION_FILE" ]; then
            . "$VERSION_FILE"
          fi

          echo "KSU_VER=${KSU_VER:-unknown}" >> $GITHUB_ENV
          echo "SUSFS_VER=${SUSFS_VER:-unknown}" >> $GITHUB_ENV

          # Solution-aware release label derived from the selected branches:
          # mixed builds report each present solution (KSUN, ReSukiSU,
          # KernelSU joined with '-'); single-family builds report their
          # own solution name.
          # NOTE: 'kernelsu-' (with trailing dash) does NOT occur in any
          # 'ksu-next*' branch name ('ksu-next-aosp', 'ksu-next-oneui',
          # 'ksu-next-susfs-aosp', 'ksu-next-susfs-oneui'), so this grep
          # only matches the tiann kernelsu-susfs-* branches.
          BRANCHES='${{ needs.prepare.outputs.branches }}'
          HAS_RESUKISU=""
          HAS_KSUN=""
          HAS_KERNELSU=""
          echo "$BRANCHES" | grep -q 'resukisu' && HAS_RESUKISU=1 || true
          echo "$BRANCHES" | grep -q 'ksu-next' && HAS_KSUN=1 || true
          echo "$BRANCHES" | grep -q 'kernelsu-' && HAS_KERNELSU=1 || true
          if [ -n "$HAS_RESUKISU" ] && [ -n "$HAS_KSUN" ] && [ -n "$HAS_KERNELSU" ]; then
            ROOT_NAME="KSUN-ReSukiSU-KernelSU"
          elif [ -n "$HAS_RESUKISU" ] && [ -n "$HAS_KSUN" ]; then
            ROOT_NAME="KSUN-ReSukiSU"
          elif [ -n "$HAS_RESUKISU" ] && [ -n "$HAS_KERNELSU" ]; then
            ROOT_NAME="ReSukiSU-KernelSU"
          elif [ -n "$HAS_KSUN" ] && [ -n "$HAS_KERNELSU" ]; then
            ROOT_NAME="KSUN-KernelSU"
          elif [ -n "$HAS_RESUKISU" ]; then
            ROOT_NAME="ReSukiSU"
          elif [ -n "$HAS_KERNELSU" ]; then
            ROOT_NAME="KernelSU"
          else
            ROOT_NAME="${ROOT_NAME:-KSUN}"
          fi
          echo "ROOT_NAME=${ROOT_NAME}" >> $GITHUB_ENV

      - name: Prepare release info
        id: info
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          {
            echo "## A52s 5G Kernel Release"
            echo ""
            echo "Automated multi-branch kernel build"
            echo ""
            echo "Branches selected:"
            echo '${{ needs.prepare.outputs.branches }}' | jq -r '.[] | "- " + .'
            echo ""
            echo "Build workflow:"
            echo "${{ github.run_id }}"
            echo ""
            echo "Commit:"
            echo "${{ github.sha }}"
            echo ""
            echo "${{ env.ROOT_NAME }}:"
            echo "${{ env.KSU_VER }}"
            echo ""
            echo "SUSFS:"
            echo "${{ env.SUSFS_VER }}"
          } > release_notes.md

      - name: Prepare release files
        run: |
          mkdir -p release-upload

          find release-files -type f -name "*.zip" | while read f
          do
            cp "$f" release-upload/
          done

          ls -lh release-upload


      - name: Release Summary
        run: |
          {
            echo "# 🚀 A52s 5G Kernel Release"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Workflow | ${{ github.run_id }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Branches |"
            echo '${{ needs.prepare.outputs.branches }}' | jq -r '.[] | "  - " + .'
            echo "| Status | Success |"
          } >> $GITHUB_STEP_SUMMARY


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "A52s 5G Kernel - ${{ steps.info.outputs.tag }} - ${{ env.ROOT_NAME }}-${{ env.KSU_VER }}-SUSFS-${{ env.SUSFS_VER }}"
          body_path: release_notes.md
          files: |
            release-upload/*.zip
