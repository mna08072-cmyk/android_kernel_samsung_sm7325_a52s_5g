name: Build A52s 5G Kernel

on:
  workflow_dispatch:
    inputs:
      build_resukisu_aosp:
        description: "Build resukisu-aosp"
        required: false
        type: boolean
        default: false

      build_resukisu_oneui:
        description: "Build resukisu-oneui"
        required: false
        type: boolean
        default: false

      build_resukisu_susfs_aosp:
        description: "Build resukisu-susfs-aosp"
        required: false
        type: boolean
        default: true

      build_resukisu_susfs_oneui:
        description: "Build resukisu-susfs-oneui"
        required: false
        type: boolean
        default: false

      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: true

      pin_resukisu:
        description: "Pin ReSukiSU SHA (empty = float to upstream tip)"
        required: false
        type: string
        default: ''

      pin_susfs:
        description: "Pin Jack mainline SHA (empty = float to upstream tip)"
        required: false
        type: string
        default: ''

      use_nomount:
        description: "Apply NoMount float"
        required: false
        type: boolean
        default: false

      pin_nomount:
        description: "Pin NoMount dev SHA (empty = float to upstream tip)"
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.matrix.outputs.branches }}
      selected: ${{ steps.matrix.outputs.selected }}
    steps:
      - id: matrix
        shell: bash
        run: |
          branches=()

          [ "${{ inputs.build_resukisu_aosp }}" = "true" ] && branches+=("resukisu-aosp")
          [ "${{ inputs.build_resukisu_oneui }}" = "true" ] && branches+=("resukisu-oneui")
          [ "${{ inputs.build_resukisu_susfs_aosp }}" = "true" ] && branches+=("resukisu-susfs-aosp")
          [ "${{ inputs.build_resukisu_susfs_oneui }}" = "true" ] && branches+=("resukisu-susfs-oneui")

          if [ ${#branches[@]} -eq 0 ]; then
            echo "No branch selected"
            exit 1
          fi

          MATRIX=$(printf '%s\n' "${branches[@]}" | jq -R -s -c 'split("\n")[:-1]')
          echo "branches=${MATRIX}" >> $GITHUB_OUTPUT
          echo "selected=${MATRIX}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Float ReSukiSU to upstream tip
        run: |
          set -euo pipefail
          RESUK_URL="https://github.com/ReSukiSU/ReSukiSU.git"
          RESUK_BRANCH="main"
          if [ -n "${{ inputs.pin_resukisu }}" ]; then
            RESUK_TIP="${{ inputs.pin_resukisu }}"
            echo "ReSukiSU pinned via input: ${RESUK_TIP}"
            git -C KernelSU fetch origin --tags --unshallow 2>/dev/null || git -C KernelSU fetch origin --tags || { echo "::error::ReSukiSU fetch failed"; exit 1; }
          else
            RESUK_TIP="$(git ls-remote "$RESUK_URL" "refs/heads/$RESUK_BRANCH" | awk '{print $1; exit}')"
            echo "ReSukiSU floating to upstream tip: ${RESUK_TIP}"
            git -C KernelSU fetch origin "$RESUK_BRANCH" --tags --unshallow 2>/dev/null || git -C KernelSU fetch origin "$RESUK_BRANCH" --tags || { echo "::error::ReSukiSU fetch failed"; exit 1; }
            FETCHED="$(git -C KernelSU rev-parse FETCH_HEAD)"
            if [ "$FETCHED" != "$RESUK_TIP" ]; then
              echo "::warning::ReSukiSU tip moved during fetch (resolved $RESUK_TIP, fetched $FETCHED); building fetched tip"
              RESUK_TIP="$FETCHED"
            fi
          fi
          [[ "$RESUK_TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid ReSukiSU SHA: ${RESUK_TIP}"; exit 1; }
          git -C KernelSU checkout "$RESUK_TIP" || { echo "::error::ReSukiSU checkout failed: ${RESUK_TIP}"; exit 1; }
          [ "$(git -C KernelSU rev-parse HEAD)" = "$RESUK_TIP" ] || { echo "::error::ReSukiSU rev-parse mismatch"; exit 1; }
          grep -q '^config KSU_SUSFS' KernelSU/kernel/Kconfig || { echo "::error::Floated ReSukiSU lacks KSU_SUSFS Kconfig symbols"; exit 1; }
          git config submodule.KernelSU.update none
          echo "RESUKISU_PIN=${RESUK_TIP}" >> $GITHUB_ENV
          echo "ReSukiSU now at $(git -C KernelSU rev-parse --short HEAD) $(git -C KernelSU describe --tags --always 2>/dev/null || true)"

      - name: Float SUSFS (fresh tip + maintained port)
        if: contains(matrix.branch, 'susfs')
        run: |
          set -euo pipefail
          SUSFS_URL="https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git"
          SUSFS_BRANCH="mainline"
          SUSFS_SUB="Patches/Patch/susfs_patch_to_5.4.patch"
          if [ -n "${{ inputs.pin_susfs }}" ]; then
            SUSFS_TIP="${{ inputs.pin_susfs }}"
            echo "SUSFS pinned via input: ${SUSFS_TIP}"
            rm -rf "${RUNNER_TEMP:?}/susfs-src"
            git clone "$SUSFS_URL" "$RUNNER_TEMP/susfs-src" || { echo "::error::SUSFS clone failed"; exit 1; }
            git -C "$RUNNER_TEMP/susfs-src" checkout "$SUSFS_TIP" || { echo "::error::SUSFS checkout failed: ${SUSFS_TIP}"; exit 1; }
          else
            SUSFS_TIP="$(git ls-remote "$SUSFS_URL" "refs/heads/$SUSFS_BRANCH" | awk '{print $1; exit}')"
            echo "SUSFS floating to upstream tip: ${SUSFS_TIP}"
            rm -rf "${RUNNER_TEMP:?}/susfs-src"
            git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_URL" "$RUNNER_TEMP/susfs-src" || { echo "::error::SUSFS clone failed"; exit 1; }
            CLONED="$(git -C "$RUNNER_TEMP/susfs-src" rev-parse HEAD)"
            if [ "$CLONED" != "$SUSFS_TIP" ]; then
              echo "::warning::SUSFS tip moved during clone (resolved $SUSFS_TIP, cloned $CLONED); building cloned tip"
              SUSFS_TIP="$CLONED"
            fi
          fi
          [[ "$SUSFS_TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid SUSFS SHA: ${SUSFS_TIP}"; exit 1; }
          [ "$(git -C "$RUNNER_TEMP/susfs-src" rev-parse HEAD)" = "$SUSFS_TIP" ] || { echo "::error::SUSFS rev-parse mismatch"; exit 1; }
          PATCH_ABS="$RUNNER_TEMP/susfs-src/$SUSFS_SUB"
          test -s "$PATCH_ABS" || { echo "::error::SUSFS patch missing in upstream: $SUSFS_SUB"; exit 1; }
          head -n1 "$PATCH_ABS" | grep -q '^diff --git' || { echo "::error::SUSFS patch header invalid"; exit 1; }
          SUSFS_VER="$(grep -m1 '#define SUSFS_VERSION' "$PATCH_ABS" | awk -F'"' '{print $2}')"
          [ -n "$SUSFS_VER" ] || { echo "::error::SUSFS version not found in patch"; exit 1; }
          git fetch origin main --depth=1 || true
          for f in integration.patch samsung-delta.patch susfs-defconfig.patch; do
            git show "origin/main:.github/susfs/maintained/$f" > "$RUNNER_TEMP/$f" || { echo "::error::Maintained $f missing on origin/main"; exit 1; }
            test -s "$RUNNER_TEMP/$f" || { echo "::error::Maintained $f empty"; exit 1; }
          done
          FRESH="$RUNNER_TEMP/susfs-fresh"
          rm -rf "$FRESH"; mkdir -p "$FRESH"; git init -q "$FRESH"
          git -C "$FRESH" apply --unsafe-paths --include="fs/susfs.c" --include="include/linux/susfs.h" --include="include/linux/susfs_def.h" "$PATCH_ABS" || { echo "::error::Fresh SUSFS core extraction failed"; exit 1; }
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            mkdir -p "$(dirname "$f")"
            cp "$FRESH/$f" "$f"
          done
          git apply --check "$RUNNER_TEMP/samsung-delta.patch" || { echo "::error::Samsung delta does not apply on fresh SUSFS tip ${SUSFS_TIP} - delta needs refresh"; exit 1; }
          git apply "$RUNNER_TEMP/samsung-delta.patch"
          git apply --check "$RUNNER_TEMP/integration.patch" || { echo "::error::Maintained integration port does not apply (branch not stripped?)"; exit 1; }
          git apply "$RUNNER_TEMP/integration.patch"
          git apply --check "$RUNNER_TEMP/susfs-defconfig.patch" || { echo "::error::SUSFS defconfig patch does not apply"; exit 1; }
          git apply "$RUNNER_TEMP/susfs-defconfig.patch"
          echo "SUSFS_TIP=${SUSFS_TIP}" >> $GITHUB_ENV
          echo "SUSFS_VER=${SUSFS_VER}" >> $GITHUB_ENV
          echo "SUSFS APPLIED: tip ${SUSFS_TIP} version ${SUSFS_VER}"

      - name: Float NoMount (fresh tip, real files)
        if: ${{ inputs.use_nomount == true }}
        run: |
          set -euo pipefail
          NOMOUNT_URL="https://github.com/maxsteeel/nomount.git"
          NOMOUNT_BRANCH="dev"
          if [ -n "${{ inputs.pin_nomount }}" ]; then
            NOMOUNT_TIP="${{ inputs.pin_nomount }}"
            echo "NoMount pinned via input: ${NOMOUNT_TIP}"
            rm -rf "${RUNNER_TEMP:?}/nomount-src"
            git clone "$NOMOUNT_URL" "$RUNNER_TEMP/nomount-src" || { echo "::error::NoMount clone failed"; exit 1; }
            git -C "$RUNNER_TEMP/nomount-src" checkout "$NOMOUNT_TIP" || { echo "::error::NoMount checkout failed: ${NOMOUNT_TIP}"; exit 1; }
          else
            NOMOUNT_TIP="$(git ls-remote "$NOMOUNT_URL" "refs/heads/$NOMOUNT_BRANCH" | awk '{print $1; exit}')"
            echo "NoMount floating to upstream tip: ${NOMOUNT_TIP}"
            rm -rf "${RUNNER_TEMP:?}/nomount-src"
            git clone --depth=1 -b "$NOMOUNT_BRANCH" "$NOMOUNT_URL" "$RUNNER_TEMP/nomount-src" || { echo "::error::NoMount clone failed"; exit 1; }
            CLONED="$(git -C "$RUNNER_TEMP/nomount-src" rev-parse HEAD)"
            if [ "$CLONED" != "$NOMOUNT_TIP" ]; then
              echo "::warning::NoMount tip moved during clone (resolved $NOMOUNT_TIP, cloned $CLONED); building cloned tip"
              NOMOUNT_TIP="$CLONED"
            fi
          fi
          [[ "$NOMOUNT_TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid NoMount SHA: ${NOMOUNT_TIP}"; exit 1; }
          [ "$(git -C "$RUNNER_TEMP/nomount-src" rev-parse HEAD)" = "$NOMOUNT_TIP" ] || { echo "::error::NoMount rev-parse mismatch"; exit 1; }
          NM_SRC="$RUNNER_TEMP/nomount-src/kernel/src"
          test -f "$NM_SRC/nomount.c" || { echo "::error::NoMount nomount.c missing in upstream"; exit 1; }
          grep -q '^config NOMOUNT' "$NM_SRC/Kconfig" || { echo "::error::NoMount Kconfig lacks NOMOUNT symbol"; exit 1; }
          NOMOUNT_VER="$(grep -m1 '#define NOMOUNT_VERSION' "$NM_SRC/nomount.h" | awk -F'"' '{print $2}')"
          [ -n "$NOMOUNT_VER" ] || { echo "::error::NoMount version not found in nomount.h"; exit 1; }
          mkdir -p fs/nomount
          cp "$NM_SRC/nomount.c" "$NM_SRC/nomount.h" "$NM_SRC/Kconfig" "$NM_SRC/Makefile" fs/nomount/
          grep -q 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile
          if ! grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig; then
            awk '/^endmenu$/ { last = NR } { lines[NR] = $0 } END { for (i = 1; i <= NR; i++) { if (i == last) print "source \"fs/nomount/Kconfig\""; print lines[i] } }' fs/Kconfig > fs/Kconfig.nomount
            mv fs/Kconfig.nomount fs/Kconfig
          fi
          LAST_ENDMENU="$(grep -n '^endmenu' fs/Kconfig | tail -1 | cut -d: -f1)"
          SRC_LINE="$(grep -n 'source "fs/nomount/Kconfig"' fs/Kconfig | cut -d: -f1)"
          LAST_ENDIF="$(grep -n '^endif' fs/Kconfig | tail -1 | cut -d: -f1)"
          [ -n "$LAST_ENDMENU" ] || { echo "::error::NoMount Kconfig guard failed: no ^endmenu found"; exit 1; }
          [ "$SRC_LINE" -gt "${LAST_ENDIF:-0}" ] && [ "$SRC_LINE" -lt "$LAST_ENDMENU" ] || { echo "::error::NoMount Kconfig misplaced (source line ${SRC_LINE}, last endif ${LAST_ENDIF:-none}, final endmenu ${LAST_ENDMENU})"; exit 1; }
          grep -q '^CONFIG_NOMOUNT=y' arch/arm64/configs/vendor/a52sxq_kor_single_defconfig || echo 'CONFIG_NOMOUNT=y' >> arch/arm64/configs/vendor/a52sxq_kor_single_defconfig
          echo "NOMOUNT_TIP=${NOMOUNT_TIP}" >> $GITHUB_ENV
          echo "NOMOUNT_VER=${NOMOUNT_VER}" >> $GITHUB_ENV
          echo "NOMOUNT APPLIED: tip ${NOMOUNT_TIP} version ${NOMOUNT_VER}"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libc6-dev bc bison flex libssl-dev \
            libelf-dev cpio kmod rsync python3 curl unzip zip \
            device-tree-compiler llvm lld clang

      - name: Make build script executable
        run: chmod +x build_kernel_zip.sh

      - name: Download clang toolchain release
        run: |
          set -e

          mkdir -p toolchain

          curl -L \
            https://github.com/${{ github.repository }}/releases/download/toolchain-r530567/clang-r530567-linux-x86.tar.gz \
            -o clang.tar.gz

          tar -xzf clang.tar.gz -C toolchain

          mv toolchain/toolchain toolchain/clang

          chmod -R +x toolchain/clang/bin

          echo "${GITHUB_WORKSPACE}/toolchain/clang/bin" >> $GITHUB_PATH

          clang --version

      - name: Enable colored build output
        run: |
          echo "TERM=xterm-256color" >> $GITHUB_ENV
          echo "CLICOLOR_FORCE=1" >> $GITHUB_ENV


      - name: Detect Kernel Versions
        run: |
          set -e

          # Select the root-solution submodule dir from the matrix branch:
          # resukisu* branches ship ReSukiSU in KernelSU/ (only family left).
          if [[ "${{ matrix.branch }}" == resukisu* ]]; then
            KSU_DIR="KernelSU"
            ROOT_NAME="ReSukiSU"
          else
            KSU_DIR="KernelSU-Next"
            ROOT_NAME="KSUN"
          fi

          KSU_VER=$(git -C "$KSU_DIR" describe --tags --always 2>/dev/null || echo unknown)

          if [ -z "$KSU_VER" ] || [ "$KSU_VER" = "unknown" ]; then
            KSU_VER=$(git -C drivers/kernelsu describe --tags --always 2>/dev/null || echo unknown)
          fi

          # susfs.h is absent on non-SUSFS branches (e.g. resukisu-aosp):
          # silence the grep and tolerate no match so this step never
          # fails here; missing version maps to unknown below.
          SUSFS_VER=$(grep '#define SUSFS_VERSION' include/linux/susfs.h 2>/dev/null | awk '{print $3}' | tr -d '"' || true)

          COMMIT=$(git rev-parse --short HEAD)

          echo "KSU_VER=${KSU_VER:-unknown}" >> $GITHUB_ENV
          echo "SUSFS_VER=${SUSFS_VER:-unknown}" >> $GITHUB_ENV
          echo "ROOT_NAME=${ROOT_NAME}" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=${COMMIT}" >> $GITHUB_ENV
          echo "RESUKISU_PIN=${RESUKISU_PIN:-unknown}" >> $GITHUB_ENV
          echo "SUSFS_TIP=${SUSFS_TIP:-none}" >> $GITHUB_ENV
          echo "NOMOUNT_TIP=${NOMOUNT_TIP:-none}" >> $GITHUB_ENV
          echo "NOMOUNT_VER=${NOMOUNT_VER:-unknown}" >> $GITHUB_ENV

          echo "========== VERSION INFO =========="
          echo "${ROOT_NAME}: ${KSU_VER:-unknown}"
          echo "SUSFS: ${SUSFS_VER:-unknown}"
          echo "ReSukiSU pin: ${RESUKISU_PIN:-unknown}"
          echo "SUSFS tip: ${SUSFS_TIP:-none}"
          echo "NoMount tip: ${NOMOUNT_TIP:-none} version: ${NOMOUNT_VER:-unknown}"
          echo "Commit: ${COMMIT}"
          echo "=================================="

      - name: Build kernel
        run: |
          set -e
          # Fully non-interactive build (replaces the legacy `yes "" |` pipe):
          # stdin is closed so an unexpected prompt fails fast instead of
          # hanging; new Kconfig symbols resolve to their defaults via
          # olddefconfig semantics.
          ./build_kernel_zip.sh < /dev/null

          # Lock in Kconfig defaults non-interactively (no-op when complete).
          make -C . O=out ARCH=arm64 olddefconfig

          # Fail-fast: CONFIG_KSU_SUSFS in the generated .config must match
          # the branch expectation (*susfs* branches require =y, all other
          # branches require unset/not-y).
          if [[ "${{ matrix.branch }}" == *susfs* ]]; then
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config \
              || { echo "::error::${{ matrix.branch }} requires CONFIG_KSU_SUSFS=y but it is not set"; grep -n 'KSU_SUSFS' out/.config || true; exit 1; }
          else
            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "::error::${{ matrix.branch }} must not enable CONFIG_KSU_SUSFS"
              grep -n 'KSU_SUSFS' out/.config || true
              exit 1
            fi
          fi
          echo "SUSFS config check passed for branch ${{ matrix.branch }}"

          # Fail-fast: CONFIG_NOMOUNT in the generated .config must match
          # the use_nomount flag (true requires =y, false requires unset).
          if [ "${{ inputs.use_nomount }}" = "true" ]; then
            grep -q '^CONFIG_NOMOUNT=y' out/.config \
              || { echo "::error::use_nomount=true requires CONFIG_NOMOUNT=y but it is not set"; grep -n 'NOMOUNT' out/.config || true; exit 1; }
          else
            if grep -q '^CONFIG_NOMOUNT=y' out/.config; then
              echo "::error::use_nomount=false must not enable CONFIG_NOMOUNT"
              grep -n 'NOMOUNT' out/.config || true
              exit 1
            fi
          fi
          echo "NoMount config check passed (use_nomount=${{ inputs.use_nomount }})"

      - name: Find output zip
        id: find_zip
        run: |
          ZIP_PATH=$(find . -maxdepth 2 -iname "*.zip" -newer build_kernel_zip.sh | head -1)
          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          echo "Found: ${ZIP_PATH}"

      - name: Save version info
        run: |
          mkdir -p version-info
          {
            echo "KSU_VER=${{ env.KSU_VER }}"
            echo "SUSFS_VER=${{ env.SUSFS_VER }}"
            echo "ROOT_NAME=${{ env.ROOT_NAME }}"
            echo "COMMIT=${{ env.KERNEL_COMMIT }}"
            echo "RESUKISU_PIN=${{ env.RESUKISU_PIN }}"
            echo "SUSFS_TIP=${{ env.SUSFS_TIP }}"
            echo "NOMOUNT_TIP=${{ env.NOMOUNT_TIP }}"
            echo "NOMOUNT_VER=${{ env.NOMOUNT_VER }}"
          } > version-info/version.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: A52s5G-${{ matrix.branch }}-${{ env.ROOT_NAME }}-${{ env.KSU_VER }}-SUSFS-${{ env.SUSFS_VER }}-NoMount-${{ env.NOMOUNT_VER }}
          path: |
            ${{ steps.find_zip.outputs.zip_path }}
            version-info/version.txt
          if-no-files-found: error


      - name: Build Summary
        run: |
          {
            echo "## A52s 5G Kernel Build"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Branch | ${{ matrix.branch }} |"
            echo "| Commit | ${{ env.KERNEL_COMMIT }} |"
            echo "| ${{ env.ROOT_NAME }} | ${{ env.KSU_VER }} |"
            echo "| SUSFS | ${{ env.SUSFS_VER }} |"
            echo "| ReSukiSU pin | ${{ env.RESUKISU_PIN }} |"
            echo "| SUSFS tip | ${{ env.SUSFS_TIP }} |"
            echo "| NoMount | ${{ env.NOMOUNT_VER }} |"
            echo "| NoMount tip | ${{ env.NOMOUNT_TIP }} |"
            echo "| Status | Success |"
          } >> $GITHUB_STEP_SUMMARY


  release:
    if: ${{ inputs.create_release == true }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Detect release versions
        run: |
          set -e

          VERSION_FILE=$(find release-files -name version.txt | head -1 || true)

          if [ -f "$VERSION_FILE" ]; then
            . "$VERSION_FILE"
          fi

          echo "KSU_VER=${KSU_VER:-unknown}" >> $GITHUB_ENV
          echo "SUSFS_VER=${SUSFS_VER:-unknown}" >> $GITHUB_ENV
          echo "RESUKISU_PIN=${RESUKISU_PIN:-unknown}" >> $GITHUB_ENV
          echo "SUSFS_TIP=${SUSFS_TIP:-none}" >> $GITHUB_ENV
          echo "NOMOUNT_TIP=${NOMOUNT_TIP:-none}" >> $GITHUB_ENV
          echo "NOMOUNT_VER=${NOMOUNT_VER:-unknown}" >> $GITHUB_ENV

          # Solution-aware release label derived from the selected branches:
          # Only resukisu* branches remain, so the release is always ReSukiSU.
          ROOT_NAME="ReSukiSU"
          echo "ROOT_NAME=${ROOT_NAME}" >> $GITHUB_ENV

      - name: Prepare release info
        id: info
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          {
            echo "## A52s 5G Kernel Release"
            echo ""
            echo "Automated multi-branch kernel build"
            echo ""
            echo "Branches selected:"
            echo '${{ needs.prepare.outputs.branches }}' | jq -r '.[] | "- " + .'
            echo ""
            echo "Build workflow:"
            echo "${{ github.run_id }}"
            echo ""
            echo "Commit:"
            echo "${{ github.sha }}"
            echo ""
            echo "${{ env.ROOT_NAME }}:"
            echo "${{ env.KSU_VER }}"
            echo ""
            echo "ReSukiSU pin:"
            echo "${{ env.RESUKISU_PIN }}"
            echo ""
            echo "SUSFS:"
            echo "${{ env.SUSFS_VER }}"
            echo ""
            echo "SUSFS tip:"
            echo "${{ env.SUSFS_TIP }}"
            echo ""
            echo "NoMount:"
            echo "${{ env.NOMOUNT_VER }}"
            echo ""
            echo "NoMount tip:"
            echo "${{ env.NOMOUNT_TIP }}"
          } > release_notes.md

      - name: Prepare release files
        run: |
          mkdir -p release-upload

          find release-files -type f -name "*.zip" | while read f
          do
            cp "$f" release-upload/
          done

          ls -lh release-upload


      - name: Release Summary
        run: |
          {
            echo "# 🚀 A52s 5G Kernel Release"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Workflow | ${{ github.run_id }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| ${{ env.ROOT_NAME }} | ${{ env.KSU_VER }} |"
            echo "| SUSFS | ${{ env.SUSFS_VER }} |"
            echo "| NoMount | ${{ env.NOMOUNT_VER }} |"
            echo "| Branches |"
            echo '${{ needs.prepare.outputs.branches }}' | jq -r '.[] | "  - " + .'
            echo "| Status | Success |"
          } >> $GITHUB_STEP_SUMMARY


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "A52s 5G Kernel - ${{ steps.info.outputs.tag }} - ${{ env.ROOT_NAME }}-${{ env.KSU_VER }}-SUSFS-${{ env.SUSFS_VER }}-NoMount-${{ env.NOMOUNT_VER }}"
          body_path: release_notes.md
          files: |
            release-upload/*.zip
